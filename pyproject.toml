[project]
name = "orchestrator-network"
version = "0.0.1"
description = "Configurable LangGraph orchestration and workflow context assembly for decision services."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "langgraph>=1.0,<2.0", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
